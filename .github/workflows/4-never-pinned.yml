name: "Scenario 4: Never pinned (walking into compromised repo)"

# Simulates: you ran `gh actions-pin` for the first time AFTER the
# attacker moved @tampered to fork commit 7b403c9. The lockfile
# recorded the attacker's SHA — you never knew the real ea53476.
#
# Expected: gh actions-pin check → valid (false negative, no baseline)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: nodeselector/actions-test-fixtures/nested-composite@tampered

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v4.3.1:sha1-34e114876b0b11c390a56381ad16ebd13914f8d5
  - github.com/nodeselector/actions-test-fixtures/nested-composite@tampered:sha1-7b403c9ec14bd3ae0bbf793c2bee8815a7ac920a

  # Transitive dependencies (via nodeselector/actions-test-fixtures/nested-composite@tampered)
  - github.com/nodeselector/actions-test-fixtures/simple-composite@main:sha1-2e757ba9851c22ba689f2b30bce91a36184fe4ee

  # Transitive dependencies (via nodeselector/actions-test-fixtures/simple-composite@main)
  - github.com/nodeselector/actions-test-fixtures-b/simple-echo@main:sha1-92b7b0058bc223c6e9dd4e19ef9247c934ba7637
