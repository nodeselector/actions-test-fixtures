name: "Scenario 2: Tag moved backward (lineage broken)"

# Pinned at the real HEAD (ea53476) before the attacker moved @bypassed
# backward to its parent commit (38b3412).
#
# Expected: gh actions-pin check → ref_moved + imposter_commit
# The pinned SHA is a descendant of the tag's new position, so the
# reachability check correctly flags it as unreachable.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: nodeselector/actions-test-fixtures/nested-composite@bypassed

# Automatically generated and managed by gh-actions-pin
